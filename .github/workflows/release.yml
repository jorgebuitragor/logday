name: Release

# Dispara con un tag `v*` (mismo esquema que ya se usa, ver
# specs/actualizaciones-automaticas/design.md). Compila para macOS
# (Apple Silicon), Windows y Linux, firma los artefactos del updater
# con los secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
# y sube instaladores + latest.json como un Release en borrador —
# publicarlo a mano después de revisar los artefactos. Las notas del
# release salen del mensaje del tag anotado (ver el paso "Notas").
#
# Linux fijado a ubuntu-22.04 (no ubuntu-latest) — mismo criterio que
# la doc oficial de Tauri: evita que un salto futuro de versión de
# Ubuntu en el runner cambie el nombre del paquete webkit2gtk por
# debajo nuestro sin darnos cuenta.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-target: ''
          - platform: ubuntu-22.04
            args: ''
            rust-target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Las notas salen del mensaje del tag anotado (`git tag -a vX.Y.Z`):
      # la primera línea es el título y el resto, en markdown, son las
      # notas. tauri-action las pone en el Release de GitHub y en el
      # `notes` de latest.json, que es lo que la app muestra en
      # "Novedades". Antes era un texto fijo y la app no tenía nada que
      # mostrar.
      - name: Notas del release (mensaje del tag)
        id: notas
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          body="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
          if [ -z "$body" ]; then body="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"; fi
          {
            echo 'body<<NOTAS_EOF'
            echo "$body"
            echo 'NOTAS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias del sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Instalar dependencias del frontend
        run: pnpm install --frozen-lockfile

      - name: Build y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Logday ${{ github.ref_name }}'
          releaseBody: ${{ steps.notas.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
