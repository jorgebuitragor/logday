name: Release

# Dispara con un tag `v*` (mismo esquema que ya se usa, ver
# specs/actualizaciones-automaticas/design.md). Compila para macOS
# (Apple Silicon), Windows y Linux, firma los artefactos del updater
# con los secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
# y sube instaladores + latest.json como un Release en borrador —
# publicarlo a mano después de revisar los artefactos.
#
# Linux fijado a ubuntu-22.04 (no ubuntu-latest) — mismo criterio que
# la doc oficial de Tauri: evita que un salto futuro de versión de
# Ubuntu en el runner cambie el nombre del paquete webkit2gtk por
# debajo nuestro sin darnos cuenta.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-target: ''
          - platform: ubuntu-22.04
            args: ''
            rust-target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Instalar dependencias del frontend
        run: pnpm install --frozen-lockfile

      - name: Build y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Logday ${{ github.ref_name }}'
          releaseBody: 'Ver los cambios de esta versión.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
