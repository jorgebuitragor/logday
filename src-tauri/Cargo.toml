[package]
name = "logday"
version = "1.0.2"
description = "Logday — local task and notes manager with markdown files"
authors = ["Jorge Buitrago"]
license = "AGPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "logday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Versión exacta (no "2" suelto) — evitaba que el crate de Rust y
# @tauri-apps/api (JS) resolvieran minors distintos por su cuenta
# (visto en pnpm tauri dev: "tauri (v2.10.3) : @tauri-apps/api
# (v2.11.1)"), ver specs/actualizaciones-automaticas/design.md.
tauri = { version = "=2.10.3", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-websocket = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
dirs-next = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi"] }
raw-window-handle = "0.6"

